<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>WAO</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGPQztnwHwAEVAJHnALJDgAAAABJRU5ErkJggg==">
  <link rel="stylesheet" href="/v2/styles.css">
</head>
<body>
  <!-- The regions are drawn by /v2/app.js (plain-text DOM nodes only); the worker side
       panel starts hidden and covers the right part of the page below the top bar while a
       worker is open. The absolute /v2/ paths matter: "/v2" without a trailing slash would
       resolve a relative path against "/". -->
  <header class="topbar" id="topbar"></header>
  <main class="page" id="main"></main>
  <aside class="sidebar" id="sidebar" hidden></aside>
  <script type="module" src="/v2/app.js"></script>
</body>
</html>
