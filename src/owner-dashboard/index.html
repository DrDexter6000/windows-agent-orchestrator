<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>WAO Owner Dashboard</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGPQztnwHwAEVAJHnALJDgAAAABJRU5ErkJggg==">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">WAO Owner Dashboard</div>
    <div class="topbar-side">
      <!-- Opt-in terminal notifications (M12-17). Enable happens ONLY from
           this explicit button click (a user gesture); the post-load baseline
           never notifies; at most one notification per run per page session;
           the payload carries only state + agentId + runId. -->
      <button id="notify-toggle" class="link-button" type="button" hidden>enable notifications</button>
      <div class="topbar-status" id="status-line" aria-live="polite">starting…</div>
    </div>
  </header>

  <!-- Concise unavailable state: shown only when there is no usable token.
       Never echoes a token, path, or raw error. -->
  <section id="unavailable" class="unavailable" hidden>
    <p>Dashboard unavailable.</p>
    <p class="muted">Open it from <code>wao runs dashboard --web</code>.</p>
  </section>

  <main id="app" class="layout" hidden>
    <section class="pane runs-pane" aria-label="Recent runs">
      <div class="pane-head">
        <input id="search" class="filter-input" type="search"
               placeholder="filter run id…" autocomplete="off"
               aria-label="Filter runs by run id">
      </div>
      <div class="filters">
        <label class="filter">
          <span class="filter-label">state</span>
          <select id="state-filter" aria-label="Filter runs by state">
            <option value="">all</option>
            <option value="pending">pending</option>
            <option value="submitted">submitted</option>
            <option value="running">running</option>
            <option value="completed">completed</option>
            <option value="failed">failed</option>
            <option value="aborted">aborted</option>
            <option value="timed_out">timed out</option>
            <option value="unknown">unknown</option>
          </select>
        </label>
        <label class="filter">
          <span class="filter-label">agent</span>
          <select id="agent-filter" aria-label="Filter runs by agent">
            <option value="">all</option>
          </select>
        </label>
      </div>
      <ul id="run-list" class="run-list" role="list"></ul>
      <p id="runs-empty" class="empty muted" hidden>No runs.</p>
    </section>

    <section class="pane detail-pane" aria-label="Selected run">
      <div id="no-selection" class="empty muted">Select a run to view its activity.</div>
      <div id="detail" hidden>
        <div class="detail-head">
          <div class="detail-run">
            <span id="detail-runid" class="mono"></span>
          </div>
          <div class="detail-facts">
            <span id="detail-state" class="state-pill"></span>
            <span id="detail-agent" class="fact"></span>
            <span id="detail-backend" class="fact"></span>
            <span id="detail-terminal" class="fact"></span>
            <span id="detail-liveness" class="fact"></span>
            <span id="detail-total" class="fact"></span>
            <span id="detail-scope" class="fact"></span>
            <button id="refresh-run" class="link-button" type="button">refresh</button>
          </div>
        </div>
        <div id="detail-unlisted" class="unavailable-inline muted" hidden></div>
        <div id="detail-unavailable" class="unavailable-inline muted" hidden></div>
        <div class="cat-filters" id="cat-filters" role="group" aria-label="Filter activity by category"></div>
        <ol id="timeline" class="timeline" role="list"></ol>
        <p id="timeline-empty" class="empty muted" hidden>No activity in this view.</p>
        <button id="load-older" class="link-button" type="button" hidden>load older</button>
      </div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
